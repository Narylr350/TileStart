name: Release
run-name: Release ${{ inputs.version || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (major.minor.patch)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:REF -ne 'refs/heads/main') {
              throw 'Manual releases must run from the main branch.'
            }
            $version = $env:INPUT_VERSION
            $tag = "v$version"
          }
          else {
            $tag = $env:REF_NAME
            $version = $tag.TrimStart('v')
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use major.minor.patch format: $version"
          }

          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and (git tag --list $tag)) {
            throw "Release tag already exists: $tag"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build:
    name: Test and package
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Run tests
        shell: pwsh
        run: dotnet test tests\TileStart.Host.Tests\TileStart.Host.Tests.csproj -c Release

      - name: Build release packages
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: .\scripts\Build-Package.ps1 -Version $env:VERSION

      - name: Stage release assets
        shell: pwsh
        run: |
          $releaseRoot = 'artifacts/release-assets'
          if (Test-Path -LiteralPath $releaseRoot) {
            Remove-Item -LiteralPath $releaseRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $releaseRoot | Out-Null
          Copy-Item 'artifacts/installer/TileStart-Setup-win-x64.exe' $releaseRoot
          Copy-Item 'artifacts/package/TileStart-portable-win-x64.zip' $releaseRoot
          Copy-Item 'artifacts/package/SHA256SUMS.txt' $releaseRoot

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TileStart-${{ needs.prepare.outputs.version }}-win-x64
          retention-days: 7
          if-no-files-found: error
          path: artifacts/release-assets/*

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TileStart-${{ needs.prepare.outputs.version }}-win-x64
          path: release-assets

      - name: Verify release checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Create draft release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "TileStart $RELEASE_TAG"
          --generate-notes
          --draft

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          release-assets/TileStart-Setup-win-x64.exe
          release-assets/TileStart-portable-win-x64.zip
          release-assets/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Delete incomplete draft
        if: failure() && steps.create_release.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            gh release delete $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
          }
          else {
            gh release delete $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --yes
          }
